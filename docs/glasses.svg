<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The glasses upgrade">
<rect x="1" y="1" width="958" height="398" rx="14" fill="#f7f8fb" stroke="#cfd5e0" stroke-width="2"/>
<text x="30" y="44" font-size="22" font-weight="700" fill="#1c2330">The glasses upgrade</text>
<text x="30" y="68" font-size="14" fill="#5b667a">Two cameras, two jobs. The Pi adds the readings together.</text>
<rect x="30" y="100" width="270" height="190" rx="12" fill="#ffffff" stroke="#1a9a5b" stroke-width="2.5"/>
<text x="165.0" y="228" font-size="16" fill="#1a9a5b" text-anchor="middle" font-weight="700">Desk camera</text>
<text x="165.0" y="250" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">Which way your head is turned,</text>
<text x="165.0" y="267" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">to within a degree or two.</text>
<g transform="translate(165 158)"><circle r="26" fill="#e3e9f6" stroke="#1c2330" stroke-width="2.5"/><circle cx="-9" cy="-4" r="3" fill="#1c2330"/><circle cx="9" cy="-4" r="3" fill="#1c2330"/><path d="M-8 11 Q0 16 8 11" fill="none" stroke="#1c2330" stroke-width="2"/><path d="M-44 -6 A46 46 0 0 1 -30 -34 m0 0 l-9 1 m9 -1 l1 9 M44 -6 A46 46 0 0 0 30 -34 m0 0 l9 1 m-9 -1 l-1 9" fill="none" stroke="#1a9a5b" stroke-width="2.5" stroke-linecap="round"/></g>
<text x="330" y="205" font-size="34" fill="#1c2330" text-anchor="middle" font-weight="700">+</text>
<rect x="360" y="100" width="270" height="190" rx="12" fill="#ffffff" stroke="#2f6fed" stroke-width="2.5"/>
<text x="495.0" y="228" font-size="16" fill="#2f6fed" text-anchor="middle" font-weight="700">Glasses camera</text>
<text x="495.0" y="250" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">Which way your eye is turned</text>
<text x="495.0" y="267" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">within your head, much more finely.</text>
<g transform="translate(495 158)"><rect x="-58" y="-18" width="48" height="36" rx="10" fill="#e3e9f6" stroke="#1c2330" stroke-width="2.5"/><rect x="10" y="-18" width="48" height="36" rx="10" fill="#e3e9f6" stroke="#1c2330" stroke-width="2.5"/><path d="M-10 -4 Q0 -12 10 -4" fill="none" stroke="#1c2330" stroke-width="2.5"/><circle cx="34" cy="0" r="8" fill="#2f6fed"/><circle cx="34" cy="0" r="3.5" fill="#1c2330"/><circle cx="-34" cy="0" r="8" fill="#fff" stroke="#1c2330" stroke-width="1.5"/><circle cx="-34" cy="0" r="3.5" fill="#1c2330"/><rect x="50" y="20" width="18" height="12" rx="3" fill="#2f6fed"/><path d="M52 20 L40 8" stroke="#2f6fed" stroke-width="2" stroke-dasharray="3 3"/></g>
<path d="M640 195 h26 m-7 -7 l7 7 l-7 7" fill="none" stroke="#1c2330" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="680" y="100" width="250" height="190" rx="12" fill="#1c2330"/>
<g transform="translate(805 158)"><rect x="-50" y="-30" width="100" height="60" rx="5" fill="#e3e9f6"/><circle cx="14" cy="-6" r="9" fill="none" stroke="#2f6fed" stroke-width="2"/><g transform="translate(16 -2) scale(.55)"><path d="M-10 -22 L-10 16 L0 7 L7 22 L13 19 L6 5 L19 5 Z" fill="#1c2330" stroke="#fff" stroke-width="2"/></g></g>
<text x="805" y="228" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">A finer landing spot</text>
<text x="805" y="250" font-size="12" fill="#c9d1e0" text-anchor="middle" font-weight="400">Head direction + eye direction</text>
<text x="805" y="267" font-size="12" fill="#c9d1e0" text-anchor="middle" font-weight="400">= the point on the screen.</text>
<text x="480" y="330" font-size="13" fill="#5b667a" text-anchor="middle" font-weight="400">Without the glasses, the desk camera does both jobs, and can only see your eyes roughly from that distance.</text>
<text x="480" y="352" font-size="13" fill="#5b667a" text-anchor="middle" font-weight="400">With them, it only has to track your head. Calibrate again whenever the glasses have shifted on your face.</text>
</svg>
