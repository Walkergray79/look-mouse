<rect x="650" y="514" width="11" height="9" rx="2" fill="#cfd5e0"/>
<rect x="665" y="514" width="11" height="9" rx="2" fill="#cfd5e0"/>
<rect x="680" y="514" width="11" height="9" rx="2" fill="#cfd5e0"/>
<rect x="695" y="514" width="11" height="9" rx="2" fill="#cfd5e0"/>
<rect x="710" y="514" width="11" height="9" rx="2" fill="#cfd5e0"/>
<rect x="725" y="514" width="11" height="9" rx="2" fill="#cfd5e0"/>
