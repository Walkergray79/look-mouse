<rect x="620" y="531" width="140" height="9" rx="2" fill="#cfd5e0"/>
<rect x="790" y="500" width="30" height="50" rx="15" fill="#ffffff" stroke="#1c2330" stroke-width="2.5"/><path d="M805 500 V520" stroke="#1c2330" stroke-width="2"/>
<path d="M608 519 H597" stroke="#5b667a" stroke-width="1.5"/>
<text x="592" y="516" font-size="14" fill="#1c2330" text-anchor="end" font-weight="700">Scroll Lock</text>
<text x="592" y="534" font-size="12" fill="#5b667a" text-anchor="end" font-weight="400">is the trigger</text>
<text x="715" y="580" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">Your normal keyboard and mouse, plugged in as usual</text>
</svg>
