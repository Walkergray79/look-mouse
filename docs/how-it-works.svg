<text x="825" y="210" font-size="16" fill="#1c2330" text-anchor="middle" font-weight="700">Cursor jumps</text>
<text x="825" y="233" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">The cursor appears there.</text>
<text x="825" y="250" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">Carry on with your mouse.</text>
