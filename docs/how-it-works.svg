<circle cx="514" cy="116" r="13" fill="#2f6fed"/><text x="514" y="121" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<g transform="translate(595 152)"><rect x="-26" y="-18" width="52" height="36" rx="5" fill="#1a9a5b"/><rect x="-20" y="-24" width="4" height="6" fill="#1a9a5b"/><rect x="-20" y="18" width="4" height="6" fill="#1a9a5b"/><rect x="-10" y="-24" width="4" height="6" fill="#1a9a5b"/><rect x="-10" y="18" width="4" height="6" fill="#1a9a5b"/><rect x="0" y="-24" width="4" height="6" fill="#1a9a5b"/><rect x="0" y="18" width="4" height="6" fill="#1a9a5b"/><rect x="10" y="-24" width="4" height="6" fill="#1a9a5b"/><rect x="10" y="18" width="4" height="6" fill="#1a9a5b"/><rect x="20" y="-24" width="4" height="6" fill="#1a9a5b"/><rect x="20" y="18" width="4" height="6" fill="#1a9a5b"/><circle r="6" fill="#fff"/></g>
<text x="595" y="210" font-size="16" fill="#1c2330" text-anchor="middle" font-weight="700">Pi locates</text>
<text x="595" y="233" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">The Pi reads your head and</text>
<text x="595" y="250" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">eye direction from the camera.</text>
<path d="M703 183 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#2f6fed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="720" y="92" width="210" height="182" rx="12" fill="#ffffff" stroke="#cfd5e0" stroke-width="1.5"/>
<circle cx="744" cy="116" r="13" fill="#2f6fed"/><text x="744" y="121" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">4</text>
