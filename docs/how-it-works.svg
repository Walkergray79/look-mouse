<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="What happens each time">
<rect x="1" y="1" width="958" height="298" rx="14" fill="#f7f8fb" stroke="#cfd5e0" stroke-width="2"/>
<text x="30" y="44" font-size="22" font-weight="700" fill="#1c2330">What happens each time</text>
<text x="30" y="68" font-size="14" fill="#5b667a">The cursor only ever moves when you ask it to.</text>
<rect x="30" y="92" width="210" height="182" rx="12" fill="#ffffff" stroke="#cfd5e0" stroke-width="1.5"/>
<circle cx="54" cy="116" r="13" fill="#2f6fed"/><text x="54" y="121" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<g transform="translate(135 152)"><path d="M-30 0 Q0 -24 30 0 Q0 24 -30 0 Z" fill="#fff" stroke="#1c2330" stroke-width="2.5"/><circle r="9" fill="#2f6fed"/><circle r="3.5" fill="#1c2330"/></g>
<text x="135" y="210" font-size="16" fill="#1c2330" text-anchor="middle" font-weight="700">Look</text>
<text x="135" y="233" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">Look at the spot you want,</text>
<text x="135" y="250" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">on any screen.</text>
<path d="M243 183 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#2f6fed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="260" y="92" width="210" height="182" rx="12" fill="#ffffff" stroke="#cfd5e0" stroke-width="1.5"/>
<circle cx="284" cy="116" r="13" fill="#2f6fed"/><text x="284" y="121" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<g transform="translate(365 152)"><rect x="-34" y="-20" width="68" height="40" rx="8" fill="#ffcf3f" stroke="#1c2330" stroke-width="2.5"/><text y="5" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2330">ScrLk</text></g>
<text x="365" y="210" font-size="16" fill="#1c2330" text-anchor="middle" font-weight="700">Press</text>
<text x="365" y="233" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">Tap Scroll Lock on your</text>
<text x="365" y="250" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">normal keyboard.</text>
<path d="M473 183 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#2f6fed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
