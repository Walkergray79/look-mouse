<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="First-time setup">
<rect x="1" y="1" width="958" height="298" rx="14" fill="#f7f8fb" stroke="#cfd5e0" stroke-width="2"/>
<text x="30" y="44" font-size="22" font-weight="700" fill="#1c2330">First-time setup</text>
<text x="30" y="68" font-size="14" fill="#5b667a">Done once. Calibrate again if you move the camera or a screen.</text>
<rect x="30" y="92" width="210" height="182" rx="12" fill="#ffffff" stroke="#cfd5e0" stroke-width="1.5"/>
<circle cx="54" cy="116" r="13" fill="#2f6fed"/><text x="54" y="121" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<g transform="translate(135 152)"><rect x="-32" y="-20" width="64" height="40" rx="6" fill="#1c2330"/><text x="-22" y="5" font-size="15" font-weight="700" fill="#ffcf3f" font-family="monospace">&gt;_</text></g>
<text x="135" y="210" font-size="16" fill="#1c2330" text-anchor="middle" font-weight="700">Install</text>
<text x="135" y="233" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">Run the installer on the Pi,</text>
<text x="135" y="250" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">reboot, plug in the USB cable.</text>
<path d="M243 183 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#2f6fed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="260" y="92" width="210" height="182" rx="12" fill="#ffffff" stroke="#cfd5e0" stroke-width="1.5"/>
<circle cx="284" cy="116" r="13" fill="#2f6fed"/><text x="284" y="121" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<g transform="translate(365 152)"><rect x="-36" y="-20" width="16" height="34" rx="3" fill="#e3e9f6" stroke="#1c2330" stroke-width="2"/><rect x="-17" y="-12" width="26" height="18" rx="3" fill="#e3e9f6" stroke="#1c2330" stroke-width="2"/><rect x="12" y="-12" width="26" height="18" rx="3" fill="#e3e9f6" stroke="#1c2330" stroke-width="2"/></g>
<text x="365" y="210" font-size="16" fill="#1c2330" text-anchor="middle" font-weight="700">Screens</text>
<text x="365" y="233" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">Enter your Windows screen</text>
<text x="365" y="250" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">layout in the settings page.</text>
<path d="M473 183 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#2f6fed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="92" width="210" height="182" rx="12" fill="#ffffff" stroke="#cfd5e0" stroke-width="1.5"/>
<circle cx="514" cy="116" r="13" fill="#2f6fed"/><text x="514" y="121" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<g transform="translate(595 152)"><rect x="-36" y="-20" width="16" height="34" rx="3" fill="#e3e9f6" stroke="#1c2330" stroke-width="2"/><rect x="-17" y="-12" width="26" height="18" rx="3" fill="#e3e9f6" stroke="#1c2330" stroke-width="2"/><rect x="12" y="-12" width="26" height="18" rx="3" fill="#e3e9f6" stroke="#1c2330" stroke-width="2"/><g transform="translate(26 4) scale(.6)"><path d="M-10 -22 L-10 16 L0 7 L7 22 L13 19 L6 5 L19 5 Z" fill="#1c2330" stroke="#fff" stroke-width="2"/></g></g>
<text x="595" y="210" font-size="16" fill="#1c2330" text-anchor="middle" font-weight="700">Pointer check</text>
<text x="595" y="233" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">Click each screen and watch</text>
<text x="595" y="250" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">the cursor land on it.</text>
<path d="M703 183 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#2f6fed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="720" y="92" width="210" height="182" rx="12" fill="#ffffff" stroke="#cfd5e0" stroke-width="1.5"/>
<circle cx="744" cy="116" r="13" fill="#2f6fed"/><text x="744" y="121" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<g transform="translate(825 152)"><rect x="-32" y="-20" width="64" height="40" rx="6" fill="#0d1016"/><circle r="8" fill="#ffcf3f"/><circle r="2.5" fill="#0d1016"/></g>
<text x="825" y="210" font-size="16" fill="#1c2330" text-anchor="middle" font-weight="700">Calibrate</text>
<text x="825" y="233" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">On each screen, look at the</text>
<text x="825" y="250" font-size="12" fill="#5b667a" text-anchor="middle" font-weight="400">dot and press Space.</text>
</svg>
